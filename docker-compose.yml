version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: edutest_postgres
    restart: always
    environment:
      POSTGRES_USER: edutest
      POSTGRES_PASSWORD: edutest_pass
      POSTGRES_DB: edutest_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
